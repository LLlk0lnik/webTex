<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="StyleForm.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация и Вход</title>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Регистрация и Вход</h1>
        <form id="auth-form">
            <div class="mb-3">
                <label for="name" class="form-label">Имя</label>
                <input type="text" class="form-control" id="name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <div class="d-flex justify-content-between">
                <button type="button" class="btn btn-primary" id="register-btn">Зарегистрироваться</button>
                <button type="button" class="btn btn-secondary" id="login-btn">Войти</button>
            </div>
        </form>
        <div id="message" class="mt-3"></div>
        <div class="text-center mt-4">
            <form action="main.html" target="_blank">
                <a href="index.html" class="btn btn-outline-info">Вернуться на сайт</a>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('register-btn').addEventListener('click', function() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Здесь вы можете добавить код для отправки данных на сервер для регистрации
            // Для демонстрации просто отобразим сообщение
            document.getElementById('message').innerHTML = `<div class="alert alert-success">Регистрация успешна! Добро пожаловать, ${name}!</div>`;
        });

        document.getElementById('login-btn').addEventListener('click', function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Здесь вы можете добавить код для отправки данных на сервер для входа
            // Для демонстрации просто отобразим сообщение
            document.getElementById('message').innerHTML = `<div class="alert alert-success">Вы вошли в систему как: ${email}!</div>`;
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
